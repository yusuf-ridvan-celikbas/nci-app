# XcodeGen spec (build tool on the Mac only, nothing is shipped): `brew install xcodegen && xcodegen`
name: CansinApp
options:
  bundleIdPrefix: com.cansin
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  CansinCore:
    path: CansinCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple team id
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
targets:
  CansinApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: CansinCore
      - target: CansinWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Salgam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.cansin.app
            CFBundleURLSchemes: [cansin]
    entitlements:
      path: App/CansinApp.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cansin.app]
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cansin.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  CansinWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: App/Resources
    dependencies:
      - package: CansinCore
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Salgam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/CansinWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cansin.app]
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cansin.app.widget
        TARGETED_DEVICE_FAMILY: "1"
